services:
  web:
    build: .
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      HOME: /app/.home
    volumes:
      - .:/app
    command: ["bash", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 36
